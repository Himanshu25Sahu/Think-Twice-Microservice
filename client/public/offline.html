<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Offline · Think Twice</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: #fcfbf7;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background-color: #fff;
        border: 1px solid #e7e2d6;
        border-radius: 0.75rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.25rem;
        border-radius: 0.75rem;
        display: block;
      }
      h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; }
      p { margin-top: 0.5rem; font-size: 0.875rem; color: #52525b; }
      button {
        margin-top: 1.5rem;
        width: 100%;
        background-color: #2563eb;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        padding: 0.625rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 200ms;
      }
      button:hover { background-color: #1d4ed8; }
      button:active { transform: scale(0.98); }
      .status { margin-top: 0.875rem; font-size: 0.75rem; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/icons/icon-192.png" alt="Think Twice" width="48" height="48" />
      <h1>You're offline</h1>
      <p>
        Think Twice needs a connection to load your entries. This page will reload
        itself as soon as you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="status" id="status"></p>
    </main>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
      var status = document.getElementById('status');
      if (!navigator.onLine) status.textContent = 'No network connection detected.';
    </script>
  </body>
</html>
